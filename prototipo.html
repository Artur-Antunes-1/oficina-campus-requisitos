function renderModule(){const m=mod(state.route);$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">${esc(m.group)}</div><h1>${esc(m.title)}</h1><p>${esc(m.summary)}</p></div><button class="button" data-action="create" data-module="${m.id}">${icon('plus')}Novo cadastro</button></div>${m.policy==='conteudo'?'<div class="alertline">Novos conteúdos começam ocultos. Publique manualmente quando estiverem prontos para aparecer no portal.</div>':''}<div class="toolbar"><label class="searchbox">${icon('search')}<input id="search" type="search" placeholder="Buscar em ${esc(m.title.toLowerCase())}…" aria-label="Buscar registros" value="${esc(state.query)}"></label><select id="filter" aria-label="Filtrar por estado">${['TODOS',...(m.policy==='conteudo'?['OCULTO','VISIVEL']:['ATIVO']),'ARQUIVADO'].map(v=>`<option value="${v}" ${state.filter===v?'selected':''}>${({TODOS:'Todos os estados',ATIVO:'Ativos',OCULTO:'Ocultos',VISIVEL:'Publicados',ARQUIVADO:'Arquivados'})[v]}</option>`).join('')}</select><select id="sort" aria-label="Ordenar registros"><option value="recentes" ${state.sort==='recentes'?'selected':''}>Mais recentes</option><option value="nome" ${state.sort==='nome'?'selected':''}>Nome A–Z</option></select>${m.id==='oficinas'?`<div class="segmented"><button aria-label="Visualização em cartões" data-action="view" data-view="cards" class="${state.view==='cards'?'active':''}">${icon('grid')}</button><button aria-label="Visualização em lista" data-action="view" data-view="list" class="${state.view==='list'?'active':''}">${icon('list')}</button></div>`:''}</div><div id="records"></div>${footer()}`;renderRecords();}
function renderRecords(){const m=mod(state.route);if(!m)return;let items=(records[m.id]||[]).filter(r=>(state.filter==='TODOS'||state.filter===r.estado)&&Object.values(r.dados).some(v=>String(v??'').toLocaleLowerCase('pt-BR').includes(state.query.trim().toLocaleLowerCase('pt-BR'))));items.sort(state.sort==='nome'?(a,b)=>label(a).localeCompare(label(b),'pt-BR'):(a,b)=>b.criadoEm.localeCompare(a.criadoEm));$('#records').innerHTML=`<div class="results-count">${items.length} ${items.length===1?'registro encontrado':'registros encontrados'}</div>`+(items.length?(m.id==='oficinas'&&state.view==='cards'?`<div class="cards">${items.map((r,i)=>card(m,r,i)).join('')}</div>`:`<div class="tablewrap"><table><thead><tr><th>${esc(m.fields[0].label)}</th><th>${esc(m.fields[1]?.label||'Informações')}</th><th>Estado</th><th>Atualização</th><th><span class="muted">Ações</span></th></tr></thead><tbody>${items.map(r=>`<tr><td><span class="truncate">${esc(r.dados[m.fields[0].key])}</span></td><td><span class="truncate muted">${esc(r.dados[m.fields[1]?.key]||'—')}</span></td><td>${badge(r)}</td><td class="muted">${date(r.atualizadoEm)}</td><td><div class="rowactions"><button class="iconbutton" title="Consultar" aria-label="Consultar ${esc(label(r))}" data-action="detail" data-module="${m.id}" data-id="${r.id}">${icon('eye')}</button>${C.canEdit(m,r)?`<button class="iconbutton" title="Editar" aria-label="Editar ${esc(label(r))}" data-action="edit" data-module="${m.id}" data-id="${r.id}">${icon('edit')}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`):`<div class="empty">${icon('search')}<h2>${state.query||state.filter!=='TODOS'?'Nenhum resultado por aqui':'Seu primeiro cadastro começa aqui'}</h2><p>${state.query||state.filter!=='TODOS'?'Tente outro termo ou altere os filtros.':'Adicione uma ficha para começar a organizar as informações.'}</p><button class="button" data-action="${state.query||state.filter!=='TODOS'?'clear':'create'}" data-module="${m.id}">${state.query||state.filter!=='TODOS'?'Limpar filtros':'Criar cadastro'}</button></div>`);}
function detail(m,r){drawerRecord=structuredClone(r);const dialog=$('#drawer');dialog.innerHTML=`<div class="drawerhead"><div><span class="eyebrow muted">${esc(m.title)}</span><h2 id="drawer-title">${esc(label(r))}</h2><p>Informações do cadastro</p></div><button class="iconbutton" data-action="close" aria-label="Fechar detalhes">${icon('close')}</button></div><div class="drawerbody"><div class="detailmeta">${badge(r)}<span class="badge">Atualizado em ${date(r.atualizadoEm)}</span></div>${r.estado==='ARQUIVADO'?`<div class="alertline">${m.policy==='operacao'?'O registro está arquivado e continua disponível para edição.':'O registro está preservado. Restaure para voltar a editar.'}</div>`:''}<dl>${m.fields.map(f=>`<div class="detailitem"><dt>${esc(f.label)}</dt><dd>${Array.isArray(r.dados[f.key])?`<ul>${r.dados[f.key].map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:f.kind==='url'?`<a href="${esc(r.dados[f.key])}" target="_blank" rel="noopener noreferrer">${esc(r.dados[f.key])} ↗</a>`:esc(r.dados[f.key]===null||r.dados[f.key]===''?'Não informado':r.dados[f.key])}</dd></div>`).join('')}</dl></div><div class="drawerfoot">${m.policy==='conteudo'&&r.estado!=='ARQUIVADO'?`<button class="outline" data-action="${r.estado==='OCULTO'?'publicar':'ocultar'}" data-module="${m.id}" data-id="${r.id}">${r.estado==='OCULTO'?'Publicar':'Ocultar'}</button>`:''}<button class="outline" data-action="${r.estado==='ARQUIVADO'?'restaurar':'arquivar'}" data-module="${m.id}" data-id="${r.id}">${icon(r.estado==='ARQUIVADO'?'restore':'archive')}${r.estado==='ARQUIVADO'?'Restaurar':'Arquivar'}</button>${C.canEdit(m,r)?`<button class="button" data-action="edit" data-module="${m.id}" data-id="${r.id}">${icon('edit')}Editar</button>`:''}</div>`;if(!dialog.open)dialog.showModal();}
function fieldHTML(f,value){let attrs=`id="f-${f.key}" name="${f.key}" ${f.required?'required':''} aria-describedby="hint-${f.key}"`;let control;
 if(f.kind==='textarea')control=`<textarea ${attrs} ${f.max?'maxlength="'+f.max+'"':''}>${esc(value)}</textarea>`;
 else if(f.kind==='select')control=`<select ${attrs}><option value="">Selecione uma opção</option>${f.options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 else if(f.kind==='list')control=`<div id="componentes">${(Array.isArray(value)&&value.length?value:['']).map((v,i)=>componentHTML(v,i,f.max)).join('')}</div><button type="button" class="outline" data-action="addcomponent">${icon('plus')}Adicionar componente</button>`;
 else control=`<input ${attrs} type="${['number','email','url'].includes(f.kind)?f.kind:'text'}" value="${esc(value)}" ${f.kind==='number'?`min="${f.min}" max="${f.max}" step="1"`:f.max?`maxlength="${f.max}"`:''}>`;
 let hint=f.hint||(f.kind==='select'?'Escolha uma das opções.':f.kind==='number'?`Número inteiro de ${f.min} a ${f.max}.`:f.max?`${f.required||f.min>0?f.min+' a ':''}${f.max} caracteres.`:'');
 return `<div class="field"><label ${f.kind!=='list'?`for="f-${f.key}"`:''}>${esc(f.label)}${!f.required?'<em>opcional</em>':''}</label>${control}<small id="hint-${f.key}">${esc(hint)}</small></div>`;
}
function componentHTML(v,i,max=100){return `<div class="component-row"><input name="componente" aria-label="Componente ${i+1}" maxlength="${max}" required value="${esc(v)}"><button type="button" class="iconbutton" data-action="removecomponent" aria-label="Remover componente ${i+1}">${icon('close')}</button></div>`;}
function edit(m,r=null){drawerRecord=r?structuredClone(r):null;const dialog=$('#drawer');dialog.innerHTML=`<div class="drawerhead"><div><span class="eyebrow muted">${esc(m.title)}</span><h2 id="drawer-title">${r?'Editar':'Cadastrar'} ${esc(m.singular)}</h2><p>${r?'Atualize as informações e salve suas alterações.':'Preencha as informações para criar uma nova ficha.'}</p></div><button class="iconbutton" data-action="close" aria-label="Fechar formulário">${icon('close')}</button></div><div class="drawerbody"><form id="record-form" data-module="${m.id}" novalidate><div id="form-error" role="alert"></div>${m.fields.map(f=>fieldHTML(f,r?.dados[f.key]??'')).join('')}<p class="smallnote">${m.policy==='conteudo'?'O conteúdo começa oculto e pode ser publicado após a revisão.':m.id==='interesses'?'Manifestar interesse não realiza inscrição nem reserva vaga.':m.id==='espacos'?'A capacidade é informativa. O cadastro não reserva espaços.':'Os dados informados pertencem apenas a esta ficha.'}</p></form></div><div class="drawerfoot"><button class="outline" data-action="close">Cancelar</button><button class="button" type="submit" form="record-form">${icon('check')}Salvar cadastro</button></div>`;if(!dialog.open)dialog.showModal();}
function confirmAction(title,message,onConfirm){const dialog=$('#confirm');dialog.innerHTML=`<h2 id="confirm-title">${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="outline" id="cancel-confirm">Cancelar</button><button class="button" id="accept-confirm">Confirmar</button></div>`;$('#cancel-confirm').onclick=()=>dialog.close();$('#accept-confirm').onclick=async()=>{if(busy)return;busy=true;$('#accept-confirm').disabled=true;try{await onConfirm();dialog.close();}catch(e){notify(e.message);}finally{busy=false;if($('#accept-confirm'))$('#accept-confirm').disabled=false;}};dialog.showModal();}
function renderDomain(){const full=modules.length===20;$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">O projeto em 3 minutos</div><h1>Aprendizagem pede organização.</h1><p>Um lugar para reunir as informações que dão suporte a oficinas acadêmicas.</p></div></div>${presentationTabs()}<div class="focusnote"><strong>O problema:</strong> propostas, contatos e orientações ficam espalhados em mensagens e planilhas. O Oficina Campus organiza essas informações em fichas simples, com consulta, manutenção e histórico preservado.${full?'':' Este repositório cobre o catálogo: oficinas, interesses, instrutores e espaços.'}</div><div class="personas">${[['MC','Marina','Organizadora de oficinas','Precisa preparar as informações de uma proposta sem se perder entre arquivos.','Reunir fichas, consultar dados e manter as informações atualizadas.','Dados dispersos e dificuldade para encontrar a versão atual.'],['LC','Lucas','Pessoa interessada','Quer comunicar temas de interesse e encontrar orientações claras.','Ter preferências registradas e consultar informações do portal.','Dúvida sobre onde encontrar informações e como sugerir temas.'],['BF','Beatriz','Apoio à organização','Precisa de referências confiáveis para apoiar as atividades.','Consultar fichas e manter as informações sob sua responsabilidade.','Instruções pouco claras e perda de histórico ao atualizar informações.']].map(([initial,name,role,context,goal,pain])=>`<article class="persona"><div class="avatar">${initial}</div><h3>${name}</h3><div class="role">${role}</div><p>${context}</p><h3>Objetivo</h3><p>${goal}</p><h3>Dificuldade</h3><p>${pain}</p></article>`).join('')}</div><p class="smallnote">Personas hipotéticas elaboradas para orientar este protótipo. Não representam entrevistas realizadas.</p><div class="twocol"><section class="panel"><h2>O que o sistema entrega</h2><p class="note">${modules.length} funcionalidades de manutenção de informações. Cada funcionalidade inclui escrita e consulta; cadastrar, editar e arquivar são operações de uma mesma funcionalidade.</p><div class="legend"><span>Fichas independentes</span><span>Arquivamento reversível</span><span>Validação no próprio registro</span></div></section><section class="panel"><h2>Limite do domínio</h2><p class="note">O recorte não gerencia inscrições, vagas, reservas ou pagamentos. Contatos e nomes são declarados. A apresentação começa pelos conceitos independentes; a consulta pública vem após a publicação do conteúdo.</p></section></div>${footer()}`;}
function renderMap(){let activities=['Ouvir a comunidade','Preparar a base','Organizar a realização','Orientar a comunidade','Aprender e manter'].filter(a=>modules.some(m=>m.activity===a));$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Jornada da organização</div><h1>Mapa de histórias do usuário</h1><p>Da escuta da comunidade à manutenção das informações.</p></div><button class="outline" data-action="print">${icon('download')}Imprimir / PDF</button></div>${presentationTabs()}<div class="focusnote">Leia as atividades da esquerda para a direita. As faixas mostram três incrementos de valor. Clique em uma história para abrir a funcionalidade correspondente. O roteiro de demonstração prioriza cadastros independentes; a consulta pública depende da publicação manual.</div><div class="map-scroll"><div class="storymap" style="grid-template-columns:repeat(${activities.length},minmax(180px,1fr))">${activities.map((a,i)=>`<div class="maphead"><small>ATIVIDADE ${String(i+1).padStart(2,'0')}</small><h3>${a}</h3></div>`).join('')}${['01 · Primeiro uso — registrar e encontrar','02 · Manutenção — corrigir e disponibilizar','03 · Preservação — arquivar e recuperar'].map((lane,l)=>`<div class="maplane">${lane}</div>${activities.map(a=>`<div class="storycolumn">${modules.filter(m=>m.activity===a).map(m=>`<button class="storycard" data-action="goto" data-module="${m.id}"><b>${l===0?'Cadastrar e consultar':l===1?(m.policy==='conteudo'?'Editar e publicar':'Editar informações'):'Arquivar e restaurar'} · ${esc(m.title)}</b><p>${l===0?esc(m.story):l===1?(m.policy==='conteudo'?'Como organizadora, quero escolher quando exibir o conteúdo para compartilhá-lo após minha revisão.':'Como responsável, quero corrigir a ficha para manter as informações úteis e atualizadas.'):(m.policy==='operacao'?'Como organizadora, quero preservar registros fora da listagem ativa, mantendo a possibilidade de edição.':'Como responsável, quero retirar registros da listagem ativa e recuperá-los preservando o histórico.')}</p><small>US-${m.owner}${String(modules.filter(x=>x.owner===m.owner).indexOf(m)+1).padStart(2,'0')}-${l+1} · Integrante ${String(m.owner).padStart(2,'0')}</small></button>`).join('')}${a==='Orientar a comunidade'&&l===1?'<a class="storycard" href="#portal"><b>Consultar conteúdo publicado</b><p>Como pessoa interessada, quero encontrar somente conteúdos disponibilizados pela organização.</p><small>Depende da publicação manual</small></a>':''}</div>`).join('')}`).join('')}</div></div><div class="legend"><span>Todos os incrementos estão incluídos nesta versão</span><span>${modules.length} funcionalidades · ${modules.length*3} histórias de manutenção</span></div>${footer()}`;}
function renderScript(){const full=modules.length===20;const stages=full?[
['00:00–02:30','Contexto, personas e mapa','Apresente o problema, os objetivos das três personas e a leitura do mapa. Explique o recorte de fichas independentes.','dominio'],
['02:30–06:00','Artur · Catálogo','Demonstre instrutores e espaços; cadastre uma oficina, mostre uma validação, edite, arquive e restaure. Registre uma manifestação de interesse.','instrutores'],
['06:00–09:00','Luca · Recursos','Mostre equipamento, recurso de acessibilidade e instituição parceira. No kit, adicione e remova descrições de componentes e salve.','equipamentos'],
['09:00–12:00','Ricardo · Relacionamento','Demonstre participante e sugestão. Registre uma resposta interna de atendimento e uma avaliação com nota de 1 a 5.','participantes'],
['12:00–15:00','João Cláudio · Operação','Mostre tarefa, procedimento, trilha e ocorrência. Altere a situação manualmente e edite um registro arquivado, preservando sua situação.','tarefas'],
['15:00–19:15','Victor · Conteúdo e portal','Cadastre ou consulte material, guia, pergunta frequente e comunicado. Publique, abra o portal, oculte, arquive e restaure como oculto. Mostre o efeito na consulta pública.','materiais'],
['19:15–20:00','Encerramento','Retome o problema resolvido e os limites do recorte. Deixe a página de visão geral aberta.','inicio']
]:[['00:00–02:30','Contexto e personas','Apresente o domínio, as personas hipotéticas e o mapa deste recorte.','dominio'],['02:30–06:00','Artur · Quatro funcionalidades','Demonstre instrutores, espaços, oficinas e manifestações de interesse. Mostre cadastro, validação, edição, arquivamento e restauração.','instrutores'],['06:00–20:00','Integração das demais partes','Este repositório contém somente as quatro funcionalidades de Artur. A apresentação coletiva precisa das partes dos demais integrantes.','inicio']];$('#conteudo').innerHTML=`<div class="pageheading"><div><div class="eyebrow muted" style="margin-bottom:10px">Apresentação · Requisitos</div><h1>Um roteiro de 20 minutos.</h1><p>Comece pelos conceitos independentes e termine no conteúdo publicado.</p></div></div>${presentationTabs()}<div class="timeline">${stages.map(([t,title,desc,id])=>`<article class="timeline-row"><time>${t}</time><div><h3>${title}</h3><p>${desc}</p><a class="textlink" href="#${id}">Abrir demonstração →</a></div></article>`).join('')}</div><div class="focusnote" style="margin-top:22px">Ensaiem com um cronômetro. Usem registros fictícios já preparados e reservem o cadastro detalhado para a oficina. As funcionalidades são independentes entre si; apenas a consulta pública pressupõe conteúdo publicado.</div>${footer()}`;}
function renderPortal(){let visible=modules.filter(m=>m.policy==='conteudo').flatMap(m=>(records[m.id]||[]).filter(r=>r.estado==='VISIVEL').map(r=>({m,r})));$('#conteudo').innerHTML=`<section class="portalhero"><div class="eyebrow muted">Portal da comunidade</div><h1>Conhecimento para levar adiante.</h1><p>Materiais, orientações e novidades compartilhados pela organização.</p></section>${visible.length?`<div class="portalgrid">${visible.map(({m,r})=>`<article class="portalitem"><div class="eyebrow">${esc(m.title)}</div><h2>${esc(label(r))}</h2>${m.fields.slice(1).map(f=>f.kind==='url'?`<p><a class="textlink" href="${esc(r.dados[f.key])}" target="_blank" rel="noopener noreferrer">Acessar material ↗</a></p>`:r.dados[f.key]?`<p>${esc(r.dados[f.key])}</p>`:'').join('')}</article>`).join('')}</div>`:`<div class="empty">${icon('book')}<h2>Novas orientações em breve.</h2><p>Os conteúdos aparecem aqui depois da publicação pela organização.</p></div>`}${footer()}`;}
async function runAction(button){const a=button.dataset.action,m=mod(button.dataset.module||state.route);let r=m&&(records[m.id]||[]).find(x=>x.id===button.dataset.id);
 if(a==='menu'){$('.sidebar').classList.toggle('open');return;}
 if(a==='close'){$('#drawer').close();return;}
 if(a==='goto'){location.hash=m.id;return;}
 if(a==='print'){window.print();return;}
 if(a==='clear'){state.query='';state.filter='TODOS';renderModule();return;}
 if(a==='view'){state.view=button.dataset.view;renderModule();return;}
 if(a==='create'){edit(m);return;}
 if(a==='detail'&&r){detail(m,r);return;}
 if(a==='edit'&&r){if(!C.canEdit(m,r))C.fail('Restaure antes de editar.',409);edit(m,r);return;}
 if(a==='addcomponent'){const list=$('#componentes');list.insertAdjacentHTML('beforeend',componentHTML('',list.children.length));list.lastElementChild.querySelector('input').focus();return;}
 if(a==='removecomponent'){button.closest('.component-row').remove();return;}
 if(['arquivar','restaurar','publicar','ocultar'].includes(a)&&r){const snapshot=drawerRecord&&drawerRecord.id===r.id?drawerRecord:r;const titles={arquivar:'Arquivar este registro?',restaurar:'Restaurar este registro?',publicar:'Publicar no portal?',ocultar:'Ocultar do portal?'};const messages={arquivar:'Os dados serão preservados e o registro sairá da listagem ativa.',restaurar:m.policy==='conteudo'?'O conteúdo voltará como oculto. A publicação deverá ser feita manualmente.':'O registro voltará à listagem ativa, preservando seus dados.',publicar:'Este conteúdo ficará disponível na consulta do portal da comunidade.',ocultar:'O conteúdo ficará acessível apenas na área de organização.'};confirmAction(titles[a],messages[a],async()=>{await change(m,snapshot,a);$('#drawer').close();renderPage();notify('Alteração salva com sucesso.');});return;}
 if(a==='reset'){confirmAction('Restaurar a demonstração?','Os dados de demonstração salvos neste navegador serão substituídos pelos exemplos iniciais.',async()=>{localStorage.removeItem(key);await refresh();renderPage();notify('Demonstração restaurada.');});return;}
 if(a==='seed'){confirmAction('Carregar exemplos fictícios?','Serão adicionados exemplos aos módulos que ainda estiverem vazios. Os cadastros existentes serão preservados.',async()=>{for(const spec of modules)if(!(records[spec.id]||[]).length)for(const data of spec.seeds)await api('/registros/'+spec.id,'POST',{dados:data});await refresh();renderPage();notify('Exemplos fictícios carregados.');});}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)runAction(b).catch(err=>notify(err.message));});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderRecords();}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){state.filter=e.target.value;renderRecords();}if(e.target.id==='sort'){state.sort=e.target.value;renderRecords();}});
document.addEventListener('submit',async e=>{if(e.target.id!=='record-form')return;e.preventDefault();if(busy)return;const form=e.target,m=mod(form.dataset.module),data={};for(const f of m.fields){if(f.kind==='list')data[f.key]=[...form.querySelectorAll('[name="componente"]')].map(el=>el.value);else{let val=form.elements.namedItem(f.key).value;data[f.key]=f.kind==='number'?(val===''?null:Number(val)):val;}}busy=true;const submit=$('[form="record-form"]');submit.disabled=true;try{await save(m,data,drawerRecord);$('#drawer').close();renderPage();notify('Cadastro salvo com sucesso.');}catch(error){$('#form-error').innerHTML=`<div class="form-error">${esc(error.message)}</div>`;$('#form-error').scrollIntoView({block:'center',behavior:'smooth'});}finally{busy=false;if(submit.isConnected)submit.disabled=false;}});
function route(){state.route=location.hash.slice(1)||'inicio';state.query='';state.filter='TODOS';if(!mod(state.route)&&!['inicio','mapa','dominio','roteiro','portal'].includes(state.route))state.route='inicio';$('#drawer').close();shell();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);window.addEventListener('storage',async e=>{if(!live&&e.key===key){await refresh();renderPage();}});
$('#app').innerHTML='<main class="content"><h1>Oficina Campus</h1><p>Preparando seu espaço…</p></main>';
if(location.protocol!=='file:'){try{let response=await fetch('/api/meta',{signal:AbortSignal.timeout(4000)});if(response.ok){let meta=await response.json();if(Array.isArray(meta.modulos)){modules=meta.modulos;live=true;}}}catch{}}
try{await refresh();route();}catch(e){$('#app').innerHTML=`<main class="content"><h1>Não foi possível carregar os cadastros.</h1><p>${esc(e.message)}</p><button class="button" onclick="location.reload()">Tentar novamente</button></main>`;}
})();
</script>
